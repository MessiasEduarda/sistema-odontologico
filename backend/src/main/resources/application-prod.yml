# Produção: nenhuma credencial padrão. A aplicação não sobe sem as variáveis obrigatórias.
spring:
  datasource:
    url: ${DB_URL}
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}
  flyway:
    url: ${DB_URL}
    user: ${MIGRATOR_DB_USER}
    password: ${MIGRATOR_DB_PASSWORD}
  # E-mail real (convites, redefinição de senha, lembretes). Sem SMTP_HOST/USERNAME/PASSWORD a API não sobe.
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    # Testa a conexão com o provedor ao iniciar: configuração errada aparece na hora, não num convite perdido.
    test-connection: ${SMTP_TEST_CONNECTION:true}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.ssl.enable: ${SMTP_SSL:false}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}

app:
  # Endereço público (https) usado nos links dos e-mails; remetente dos e-mails. Obrigatórios em produção.
  public-url: ${APP_PUBLIC_URL}
  mail:
    from: ${MAIL_FROM}
