# Configuração comum a todos os perfis. O que depende do ambiente (banco, e-mail, URLs, seed) fica no arquivo do
# perfil: application-dev.yml (local), application-prod.yml (produção) e application-test.yml (testes).
# Defina o perfil com SPRING_PROFILES_ACTIVE (ou --spring.profiles.active=...).
spring:
  application:
    name: odonto-api
  threads:
    virtual:
      enabled: true

  datasource:
    username: ${APP_DB_USER:odonto_app}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      pool-name: odonto-app

  flyway:
    user: ${MIGRATOR_DB_USER:odonto_migrator}
    schemas: ${APP_DB_SCHEMA:odonto}
    default-schema: ${APP_DB_SCHEMA:odonto}
    create-schemas: false
    locations: classpath:db/migration
    placeholders:
      app_db_user: ${APP_DB_USER:odonto_app}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${APP_DB_SCHEMA:odonto}
        jdbc:
          time_zone: UTC

  mvc:
    problemdetails:
      enabled: true

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB

  jackson:
    deserialization:
      # Jackson 3 rejeita por padrão campos primitivos ausentes; aqui um booleano omitido vale false.
      fail-on-null-for-primitives: false

  # E-mail (SMTP): servidor e autenticação são definidos no perfil (dev: Mailpit local; prod: provedor real).
  mail:
    default-encoding: UTF-8
    properties:
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Confia em X-Forwarded-For apenas de proxies internos (ex.: o servidor do Next.js).
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    build:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: br.com.odontosaas

logging:
  level:
    root: INFO

# --- Configurações da aplicação ---
app:
  security:
    session-cookie-name: odonto_session
    cookie-secure: ${COOKIE_SECURE:true}
    session-idle-timeout: ${SESSION_IDLE_TIMEOUT:30m}
    session-absolute-timeout: ${SESSION_ABSOLUTE_TIMEOUT:12h}
    login-window: 15m
    login-max-failures-per-email: 5
    login-max-failures-per-ip: 30
    password-reset-ttl: 30m
    password-reset-max-per-hour: 3
    invitation-ttl: 7d
  # Cria o primeiro administrador da plataforma se ainda não existir nenhum (produção).
  bootstrap:
    platform-admin-email: ${PLATFORM_ADMIN_EMAIL:}
    platform-admin-password: ${PLATFORM_ADMIN_PASSWORD:}
  seed:
    enabled: false
  # Anexos do prontuário (fora de qualquer pasta pública). Em produção, use um volume persistente com backup.
  storage:
    path: ${STORAGE_PATH:./data/uploads}
  # Central de suporte: e-mail mostrado a quem não consegue entrar e e-mails extras que recebem os avisos de chamados
  # (os administradores da plataforma sempre recebem). Prazos contados de segunda a sexta, das 8h às 18h, neste fuso.
  support:
    contact-email: ${SUPPORT_CONTACT_EMAIL:}
    notify-email: ${SUPPORT_NOTIFY_EMAIL:}
    time-zone: ${SUPPORT_TIME_ZONE:America/Sao_Paulo}
  # Rotinas agendadas (lembretes e envio de e-mails).
  jobs:
    enabled: ${JOBS_ENABLED:true}
    reminders-delay: PT5M
    dispatch-delay: PT1M
